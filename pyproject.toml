[project]
name = "rag_against_the_machine"
version = "0.1.0"
description = "Codam Core Curriculum: Retrieval-Augmented Generation"
readme = "README.md"
requires-python = ">= 3.12"
dependencies = [
    "accelerate>=1.15.0",
    "bm25s>=0.3.16",
    "fire>=0.7.1",
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pathlib>=1.0.1",
    "pydantic>=2.14.2",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.22.2",
]

[tool.mypy]
mypy_path = "."
explicit_package_bases = true
