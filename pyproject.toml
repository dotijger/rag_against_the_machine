[project]
name = "rag_against_the_machine"
version = "0.1.0"
description = "Codam Core Curriculum: Retrieval-Augmented Generation"
readme = "README.md"
requires-python = ">= 3.12"
dependencies = [
    "accelerate>=1.15.0",
    "bm25s>=0.3.16",
    "fire>=0.7.1",
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pathlib>=1.0.1",
    "pydantic>=2.14.2",
    "pystemmer>=3.1.0",
    "rich>=15.0.0",
    "sentence-transformers>=5",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.22.2",
]

[tool.mypy]
exclude = ['^\.venv/', '^data/']
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ['bm25s', 'bm25s.*', 'Stemmer', 'fire']
ignore_missing_imports = true

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "types-tqdm>=4.70.0.20261122",
]

[tool.ruff]
line-length = 79
